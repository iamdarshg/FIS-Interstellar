[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hound-pi"
version = "0.1.0"
description = "HOUND Pi Safe Command Agent"
requires-python = ">=3.11"
dependencies = [
    "aiohttp==3.11.14",
    "pydantic==2.10.6",
    "gpiozero==2.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-cov==6.0.0",
    "hypothesis==6.131.9",
    "ruff==0.11.2",
    "mypy==1.15.0",
]

[tool.pytest.ini_options]
testpaths = ["pi/tests", "tools/tests"]
python_files = ["test_*.py"]
addopts = "--import-mode=importlib"
pythonpath = ["pi"]



[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
